[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glsm-product-tube-metric-5-81"
version = "2.0.0"
description = "Exact verifier for an open product-tube corrected GLSM metric theorem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Evgeniy Agafonov", email = "my@eagafonov.ru"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[project.scripts]
verify-glsm-product-tube = "glsmtube.verify:main"

[tool.setuptools.packages.find]
where = ["src"]
